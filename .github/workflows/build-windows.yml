name: Instalador Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Teste (gera um PDF de exemplo)
        run: npm test

      - name: Gerar instalador, versão portátil e ZIP
        run: npm run dist:win

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-Instalador
          path: dist/Casa-Vertigem-Hub-Setup-*.exe
          if-no-files-found: error

      - name: Publicar versão portátil (um único .exe, sem instalação)
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-Portatil
          path: dist/Casa-Vertigem-Hub-Portatil-*.exe
          if-no-files-found: error

      - name: Publicar versão portátil em pasta (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-ZIP
          path: dist/Casa-Vertigem-Hub-*-x64.zip
          if-no-files-found: error

      - name: Criar release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
