name: Instalador Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Teste (gera um PDF de exemplo)
        run: npm test

      - name: Baixar logotipos dos selos e filetes da Casa Vertigem
        run: node scripts/fetch-assets.js

      - name: Gerar instalador, versão portátil e ZIP
        run: npm run dist:win

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-Instalador
          path: dist/Casa-Vertigem-Hub-Setup-*.exe
          if-no-files-found: error

      - name: Publicar versão portátil (um único .exe, sem instalação)
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-Portatil
          path: dist/Casa-Vertigem-Hub-Portatil-*.exe
          if-no-files-found: error

      - name: Publicar versão portátil em pasta (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Casa-Vertigem-Hub-ZIP
          path: dist/Casa-Vertigem-Hub-*-x64.zip
          if-no-files-found: error

      - name: Versão do sistema
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "v=$v" >> $env:GITHUB_OUTPUT

      # cada versão nova vira uma Release (v<versão>): é dela que a tela Configurações → Atualizar baixa o instalador
      - name: Publicar a versão para a atualização automática
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/kind-edison-1d7mv8' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Casa Vertigem Hub ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.zip
