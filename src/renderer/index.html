<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob:; font-src 'self' app: data:; style-src 'self' app: 'unsafe-inline'; script-src 'self' app:; frame-src 'self' app:; connect-src 'self' app: data: blob:">
<title>Casa Vertigem Hub</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ui.css">
<script src="theme.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#0d0d0f"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"><path d="M106 262 L256 136 L406 262"/><path d="M160 222 V372 H352 V222"/><path d="M232 372 V318 A24 24 0 0 1 280 318 V372"/><path d="M318 186 V150 H342 V206"/></g></svg>
    <span class="brand-name">CASA VERTIGEM <b>HUB</b></span>
  </div>
  <div class="actions">
    <button data-cmd="new" title="Novo livro, revista ou jornal (Ctrl+N)">Novo</button>
    <button data-cmd="open" title="Abrir (Ctrl+O)">Abrir</button>
    <button data-cmd="save" title="Salvar (Ctrl+S)">Salvar</button>
    <button data-cmd="import" title="Importar DOCX, DOC, EPUB, PDF, ODT, TXT, MD (Ctrl+I)">Importar</button>
    <button data-cmd="enhance" title="Melhoramento: EPUBs do Project Gutenberg → DOCX limpo no padrão do sistema (um ou vários)">Melhoramento</button>
    <button data-cmd="translate" title="Tradução: livros de qualquer idioma → português do Brasil, com preparação de texto e o padrão do sistema (um ou vários)">Tradução</button>
    <span class="sep"></span>
    <span id="genreSlot"></span>
    <span class="sep"></span>
    <button data-cmd="projectUndo" id="btnUndo" title="Desfazer ação do projeto (Ctrl+Alt+Z)">↶ Desfazer</button>
    <button data-cmd="projectRedo" id="btnRedo" title="Refazer ação do projeto (Ctrl+Alt+Y)">↷</button>
    <button data-cmd="history" title="Histórico de alterações">Histórico</button>
    <span class="sep"></span>
    <button data-cmd="library" id="btnLibrary" title="Biblioteca de imagens (arraste para o texto ou para a página)">Biblioteca</button>
    <button id="btnNight" title="Modo noturno (liga/desliga)">🌙</button>
    <button id="btnElements" title="Tabelas, planilhas, gráficos e elementos extras (arraste para o texto ou para a página)">Elementos</button>
    <button data-cmd="settings" title="Configurações: versão do sistema e atualização pelo GitHub">Configurações</button>
    <button data-cmd="export" class="primary" title="Exportar (Ctrl+E)">Exportar</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav">
      <div class="nav-group" data-ws-label>Livro</div>
      <button class="nav-item" data-view="periodical" data-ws="periodical"><span class="ic">▥</span>Publicação e matérias</button>
      <button class="nav-item" data-view="pagelayouts" data-ws="periodical"><span class="ic">▦</span>Composições de página</button>
      <button class="nav-item" data-view="frontimages" data-ws="book"><span class="ic">▣</span>Capa e imagens iniciais</button>
      <button class="nav-item" data-view="book"><span class="ic">ℹ</span>Dados e páginas iniciais</button>
      <button class="nav-item" data-view="catalog" data-ws="book"><span class="ic">▦</span>Créditos e ficha</button>
      <button class="nav-item" data-view="back"><span class="ic">✎</span>Páginas finais</button>
      <button class="nav-item" id="navTitles" title="Corrigir capítulos e títulos identificados errado"><span class="ic">Aa</span>Revisar títulos</button>
      <div class="nav-group">Design</div>
      <button class="nav-item" data-view="layout"><span class="ic">▤</span>Formato e diagramação</button>
      <button class="nav-item" data-view="immersion" data-ws="book"><span class="ic">✦</span>Imersão</button>
      <button class="nav-item" data-view="typo"><span class="ic">ﬁ</span>Tipografia e paginação</button>
      <button class="nav-item" data-view="titles"><span class="ic">▣</span>Estilos de título</button>
      <button class="nav-item" data-view="blocks"><span class="ic">◫</span>Blocos e páginas sangradas</button>
      <button class="nav-item" data-view="boxes"><span class="ic">▤</span>Caixas</button>
      <button class="nav-item" data-view="stylelib"><span class="ic">❦</span>Biblioteca de estilos</button>
      <button class="nav-item" data-view="styles"><span class="ic">¶</span>Estilos de texto</button>
      <button class="nav-item" data-view="fonts"><span class="ic">A</span>Fontes</button>
      <button class="nav-item" data-view="assets"><span class="ic">▣</span>Imagens do projeto</button>
      <button class="nav-item" data-view="layers"><span class="ic">◧</span>Camadas da página</button>
      <div class="nav-group">Produção</div>
      <button class="nav-item" data-view="notes"><span class="ic">¹</span>Notas de rodapé</button>
      <button class="nav-item" data-view="tools"><span class="ic">✓</span>Revisão do texto</button>
      <button class="nav-item" data-view="cover" data-ws="book"><span class="ic">▭</span>Capa e lombada</button>
      <button class="nav-item" data-view="export"><span class="ic">⇩</span>Exportar</button>
      <button class="nav-group nav-toggle" data-ws="book" id="modulesToggle" title="Módulos opcionais: o padrão é o livro">Outros módulos <span class="caret">▸</span></button>
      <div id="modulesList" class="nav-modules">
        <button class="nav-item" data-view="poetry"><span class="ic">✒</span>Poesia</button>
        <button class="nav-item" data-view="kdp"><span class="ic">a</span>Amazon KDP</button>
      </div>
      <div class="nav-group">Sistema</div>
      <button class="nav-item" data-view="appearance"><span class="ic">◐</span>Aparência do sistema</button>
      <button class="nav-item" data-view="reset"><span class="ic">↺</span>Restaurar padrões</button>
    </nav>
    <div class="chapters-head">
      <span>Capítulos</span>
      <span class="ch-actions">
        <button id="selectMode" class="icon-btn" title="Selecionar vários capítulos para editar em conjunto">☑</button>
        <button id="addChapter" class="icon-btn" title="Adicionar capítulo">＋</button>
      </span>
    </div>
    <div id="bulkBar" class="bulk-bar"></div>
    <ol id="chapterList" class="chapter-list"></ol>
    <div class="sidebar-foot">
      <div id="wordCount">0 palavras</div>
      <div class="offline">● Trabalhando offline</div>
    </div>
  </aside>

  <main class="workspace">
    <section id="view-frontimages" class="view"></section>
    <section id="view-book" class="view"></section>
    <section id="view-catalog" class="view"></section>
    <section id="view-back" class="view"></section>
    <section id="view-layout" class="view"></section>
    <section id="view-styles" class="view"></section>
    <section id="view-typo" class="view"></section>
    <section id="view-immersion" class="view"></section>
    <section id="view-fonts" class="view"></section>
    <section id="view-assets" class="view"></section>
    <section id="view-layers" class="view"></section>
    <section id="view-notes" class="view"></section>
    <section id="view-tools" class="view"></section>
    <section id="view-cover" class="view"></section>
    <section id="view-kdp" class="view"></section>
    <section id="view-periodical" class="view"></section>
    <section id="view-blocks" class="view"></section>
    <section id="view-titles" class="view"></section>
    <section id="view-boxes" class="view"></section>
    <section id="view-pagelayouts" class="view"></section>
    <section id="view-poetry" class="view"></section>
    <section id="view-stylelib" class="view"></section>
    <section id="view-export" class="view"></section>
    <section id="view-reset" class="view"></section>
    <section id="view-appearance" class="view"></section>
    <section id="view-bulk" class="view"></section>
    <section id="view-chapter" class="view chapter-view">
      <div class="editor-wrap">
        <div class="editor-scroll" id="editorScroll">
          <article id="editor" class="editor" contenteditable="true" spellcheck="true" lang="pt-BR"></article>
          <div id="dropIndicator" class="drop-indicator"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="splitter" id="splitter" title="Arraste para redimensionar"></div>

  <section class="preview">
    <div class="stage-head" id="stageHead">
        <div class="chapter-meta">
          <input id="chapterTitle" class="chapter-title-input" placeholder="Título do capítulo">
          <label class="chk"><input type="checkbox" id="chapterNumbered"> Numerado</label>
          <button id="chapterLock" class="ghost" title="Bloquear contra edição e exclusão acidental">🔓 Bloquear</button>
          <button id="chapterLook" class="ghost" title="Cor da página, fontes, cores, separador e imagem de abertura deste capítulo">🎨 Aparência</button>
          <button id="chapterDelete" class="ghost danger" title="Excluir capítulo">Excluir</button>
        </div>
        <div id="chapterLookPanel" class="look-panel"></div>
        <div id="lockBanner" class="lock-banner">🔒 Capítulo bloqueado — desbloqueie para editar, mover ou excluir.</div>
        <div class="toolbar" id="editorToolbar">
          <select id="blockFormat" title="Estilo do parágrafo">
            <option value="p">Texto principal</option>
            <option value="h2">T1 — Título de seção</option>
            <option value="h3">T2 — Subtítulo</option>
            <option value="h4">T3 — Intertítulo</option>
            <option value="blockquote">Citação longa</option>
            <option value="phrase">Frase em destaque</option>
            <option value="poem">Poesia</option>
            <option value="epigraph-inline">Epígrafe</option>
            <option value="reference">Referência</option>
            <option value="box">Caixa de destaque</option>
          </select>
          <span class="tsep"></span>
          <button data-exec="bold" title="Negrito (Ctrl+B)"><b>N</b></button>
          <button data-exec="italic" title="Itálico (Ctrl+I)"><i>I</i></button>
          <button data-exec="underline" title="Sublinhado (Ctrl+U)"><u>S</u></button>
          <button data-action="smallcaps" title="Versalete"><span style="font-variant:small-caps">Vs</span></button>
          <button data-exec="superscript" title="Sobrescrito">x²</button>
          <button id="hlBtn" title="Marcador de texto (contorno colorido no trecho selecionado)">🖍</button>
          <span class="tsep"></span>
          <button data-exec="justifyLeft" title="Alinhar à esquerda">⯇</button>
          <button data-exec="justifyCenter" title="Centralizar">≡</button>
          <button data-exec="justifyRight" title="Alinhar à direita">⯈</button>
          <button data-exec="justifyFull" title="Justificar (padrão)">☰</button>
          <button data-action="noindent" title="Parágrafo sem recuo">⇤</button>
          <span class="tsep"></span>
          <button data-exec="insertUnorderedList" title="Lista">•</button>
          <button data-exec="insertOrderedList" title="Lista numerada">1.</button>
          <span class="tsep"></span>
          <button data-action="footnote" title="Inserir nota de rodapé no cursor (clique na nota para editar ou remover)">¹ Nota</button>
          <button data-action="removenotes" title="Remover todas as notas de rodapé do livro (pode ser desfeito)">¹✕ Notas</button>
          <button data-action="link" title="Ligação para outro capítulo/título (com nº de página) ou para um site (Ctrl+K)">🔗 Ligação</button>
          <button data-action="scene" title="Quebra de cena">✱</button>
          <button data-action="pagebreak" title="Quebra de página (Ctrl+Enter)">⤓ Pág.</button>
          <button data-action="image" title="Inserir imagem do computador">🖼 Imagem</button>
          <button data-action="fullbleed" title="Inserir imagem de página inteira (sangrada)">▣ Pág. inteira</button>
          <button data-action="table" title="Inserir tabela">▦ Tabela</button>
          <button data-action="chart" title="Inserir gráfico">📊 Gráfico</button>
          <span class="tsep"></span>
          <button data-action="newsection" title="Criar uma nova página/seção com título logo depois deste capítulo">＋ Seção</button>
          <button data-action="split" title="Dividir o capítulo no cursor: o texto a partir daqui vira um novo capítulo">✂ Dividir</button>
          <span class="tsep"></span>
          <button data-exec="removeFormat" title="Limpar formatação">⌫</button>
          <button data-action="invisibles" title="Mostrar caracteres invisíveis">¶</button>
          <button data-exec="undo" title="Desfazer digitação (Ctrl+Z)">↶</button>
          <button data-exec="redo" title="Refazer (Ctrl+Y)">↷</button>
        </div>
    </div>
    <div class="preview-bar">
      <strong class="stage-label">Páginas</strong>
      <span id="pageInfo" class="muted">—</span>
      <span class="grow"></span>
      <button id="zoomOut" class="icon-btn" title="Diminuir zoom">−</button>
      <span id="zoomLabel" class="zoom-label">50%</span>
      <button id="zoomIn" class="icon-btn" title="Aumentar zoom">＋</button>
      <select id="previewMode" title="Modo de visualização">
        <option value="single">1 página por vez (rolar)</option>
        <option value="spread">Páginas duplas (livro aberto)</option>
        <option value="cols2">2 páginas lado a lado</option>
        <option value="cols3">3 páginas lado a lado</option>
        <option value="cols4">4 páginas lado a lado</option>
        <option value="cols5">5 páginas lado a lado</option>
      </select>
      <button id="zoomFit" class="icon-btn" title="Ajustar à largura da prévia">⤢</button>
      <button id="insertBleedPage" title="Inserir uma página de imagem (página inteira, sangrada) antes ou depois de um capítulo">🖼 Página de imagem</button>
      <label class="chk small" title="Ativa/desativa as guias: linha de corte (vermelho), área de sangria (tracejado vermelho), área segura (verde) e margens (azul)"><input type="checkbox" id="guides"> Sangria e margens</label>
      <label class="chk small" title="Pré-visualizar em tons de cinza"><input type="checkbox" id="gray"> Cinza</label>
      <label class="chk small" title="Atualizar a prévia automaticamente"><input type="checkbox" id="autoRefresh" checked> Auto</label>
      <button id="refresh" title="Atualizar prévia (F5)">Atualizar</button>
    </div>
    <div class="preview-frames" id="previewFrames">
      <div class="preview-busy" id="previewBusy">Paginando…</div>
      <aside id="figPanel" class="fig-panel"></aside>
    </div>
  </section>
</div>

<aside id="libraryDrawer" class="drawer"></aside>
<aside id="elementsDrawer" class="drawer"></aside>
<div id="toast" class="toast" role="status"></div>
<div id="modalRoot"></div>

</body>
